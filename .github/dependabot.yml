# Dependabot keeps our pinned dependencies current (review finding F4).
#
# Why this exists: the GitHub Actions in .github/workflows/* are pinned to
# immutable commit SHAs (a compromised or force-moved tag therefore can't
# inject code). A SHA pin is only safe if something proposes the upgrades —
# that is Dependabot's job here. It opens one PR per update with the new SHA
# and a refreshed `# vX.Y.Z` comment, so every bump (including major jumps such
# as actions/checkout v4 -> v7) is reviewed and CI-gated individually instead
# of silently floating on a mutable tag.
#
# The npm updates burn down the dependency backlog so we can eventually lower
# the audit gate (dependency-audit.yml) from `high` to `moderate` (see F4 /
# package.json auditConfig).
#
# The `docker` ecosystem tracks the digest-pinned `node:24-bookworm-slim` base
# image in the Dockerfile (both stages share one digest), so base-image CVE
# fixes arrive as reviewable PRs instead of accumulating until the weekly Trivy
# scan (docker-scan.yml, a required check) goes red.
#
# NOT covered here: the gitleaks and lychee container images are pinned by
# digest inside `docker run` steps (not `uses:`), which no Dependabot ecosystem
# tracks — bump those manually using the `# vX.Y.Z` comment next to each digest.
#
# NOT controlled here either: SECURITY-update PRs (the ones Dependabot opens
# for an advisory, as opposed to the scheduled VERSION updates below). They
# exist only while the repository setting "Dependabot security updates" is
# enabled — Settings → Advanced Security → Enable, or `gh api -X PUT
# repos/devresponse/devresponsekit/automated-security-fixes` — and nothing in
# this file can turn it on. It was found OFF on 2026-09-24 (review F-28). Every
# comment below that says a security update "still arrives" describes what
# happens while the setting is on; with it off, an advisory produces an alert
# and no PR. The weekly `Dependabot alerts` job in dependency-audit.yml turns
# an open high/critical alert into a failed run either way, and SECURITY.md →
# Repository security settings is the operator check for the setting itself.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
    # Node MAJOR jumps (22 -> 26, PR #388) are a deliberate runtime upgrade
    # (.nvmrc, CI setup-node, engines `24.x`, the dependency-governance
    # invariant all pin one major — 24 today) — never an unattended bump.
    # Digest and minor/patch bumps still arrive; hand-closing a major PR would
    # only make Dependabot re-propose it.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Supply-chain cooldown (review #226): never propose a version that has
    # been on the registry for less than a day — long enough for a hijacked
    # publish to be pulled. Security updates are exempt (a cooldown never
    # delays them — but they open only while the repository's "Dependabot
    # security updates" setting is on, see the header), so this delays
    # convenience bumps only. It also keeps Dependabot in step with
    # `.npmrc`'s `minimum-release-age=1440`,
    # which would otherwise refuse to RE-RESOLVE a bump proposed inside the
    # cooldown window (e.g. when a maintainer regenerates the lockfile).
    cooldown:
      default-days: 1
    # Group routine minor/patch bumps to keep PR volume sane; major updates
    # still open as individual PRs for closer review. The groups are
    # `applies-to: version-updates`, so security updates (when the repository
    # setting is on — see the header) are never grouped either.
    groups:
      # `next` and `eslint-config-next` must move in ONE PR:
      # tests/unit/dependency-governance.test.ts pins the direct
      # eslint-config-next version to next's (the lint rules have to match the
      # runtime). next is a production dependency and eslint-config-next a
      # development one, so the two groups below split every Next bump across
      # two PRs that each fail that test on their own (#478 + #479, landed
      # together as #481). A dependency joins the FIRST group it matches, so
      # this group must stay above them. It has no `dependency-type`, so it
      # spans both, and it takes majors too, which need the same pairing.
      next:
        applies-to: version-updates
        patterns: ["next", "eslint-config-next"]
        update-types: ["major", "minor", "patch"]
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    # @tanstack/react-table is HELD on the v8 line (declined 2026-09-04 after
    # PR #378, re-measured 2026-09-21). Evidence, so the next person does not
    # re-derive it:
    #
    #   * The headline "187 type errors" was a SYMPTOM COUNT, not a cost. v9
    #     prepends a `TFeatures` generic, so a written-out `ColumnDef<Row,
    #     unknown>` silently rebinds `TFeatures = Row, TData = unknown` and
    #     every `row.original` downstream collapses. That single mistake was
    #     echoed 168 times. Re-measured on today's tree it is 189 errors, and
    #     it collapses in five mechanical steps: the column alias + import
    #     rewrites (189 -> 46), porting data-grid.tsx (-> 11), a `RowData`
    #     constraint (-> 3), pinning the hook generics (-> 1), and one option
    #     rename (-> 0). A day or two of work, not a project.
    #   * Most of that is now ALREADY DONE. PR #465 confined the column type to
    #     `GridColumnDef` in the grid module, so the 18-file half of the port is
    #     a one-line diff in that file. What remains is data-grid.tsx alone.
    #   * The one genuine design decision is the feature registry: v9 requires
    #     `tableFeatures({ ... })` and this grid needs exactly `rowSortingFeature`
    #     (for the per-column `enableSorting` flag). Sorting, filtering and
    #     pagination are all server-driven through URL state, so
    #     getCoreRowModel / manualPagination / manualFiltering / pageCount all
    #     become no-ops.
    #   * THE REAL HAZARD IS NOT TYPES. v9's breaks are render-time and invisible
    #     to `tsc`: row/cell/header accessors move to memoized PROTOTYPE methods
    #     (a detached `h.getContext` reference throws — pinned by
    #     tests/unit/admin-grid-no-detached-table-methods.test.ts),
    #     `row.getVisibleCells()` is gone (`getAllCells` replaces it), and the
    #     option key is `features` — the underscore spelling is silently ignored,
    #     yielding a table with no sorting flags and no error. The component and
    #     e2e suites that RENDER the grid are the only detector; typecheck is
    #     evidence of nothing here.
    #   * What it buys THIS codebase is close to nothing today. v9's headline is
    #     fine-grained reactivity via an atom store, but the grid holds at most
    #     one server-fetched page and re-renders on URL change anyway. Package
    #     dist is bigger before tree-shaking (~97 kB vs ~54 kB gzipped; v9 sets
    #     sideEffects:false, and the built-app delta is UNMEASURED). v9 is also
    #     ESM-only and adds @tanstack/react-store as a runtime dependency.
    #   * Cost of staying: drift, not exposure. 8.21.3 shipped 2025-04-14 and the
    #     v8 line has had no release since, but there has never been a security
    #     advisory for @tanstack/react-table or @tanstack/table-core, and its
    #     peer range (react >=16.8) conflicts with nothing here.
    #
    # The hold is narrow on purpose. Only the MAJOR line is ignored, so 8.x
    # minor/patch still arrive — and so would a SECURITY update, which an
    # `update-types` ignore never suppresses, provided the repository's
    # "Dependabot security updates" setting is on (see the header).
    # REVISIT when any of these fire, and do the port then rather than on a
    # calendar: (a) a React or Next major that v8 cannot follow; (b) any GHSA
    # against @tanstack/react-table or @tanstack/table-core; (c) a product need
    # for a CLIENT-side grid feature (client sorting/filtering/pagination,
    # virtualization, column visibility or resizing) — v8 can still do these, but
    # they are what makes v9's model worth its cost. Do NOT target
    # @tanstack/react-table/legacy (`useLegacyTable`): it would shrink the diff
    # but is deprecated on arrival.
    #
    # jsdom is HELD at 30.0.1 on a MINOR hold (not a decline) because 30.1.0
    # regressed focus emulation in a way that silently breaks every Radix popup
    # test. Evidence, so the next person does not re-derive it:
    #
    #   * jsdom 30.1.0 added a focus-fixup rule to Node-impl.js `_removingSteps`:
    #     removing the focused element now sets `_lastFocusedElement` to the
    #     DOCUMENT (30.0.1 set it to `null`). The next `element.focus()` then
    #     treats that Document as the previously-focused thing, and
    #     `fireFocusEventWithTargetAdjustment` retargets a Document to its
    #     Window — so a `blur` event is dispatched AT `window`.
    #   * @radix-ui/react-select and @radix-ui/react-menu both do
    #     `window.addEventListener("blur", close)` to notice "the user switched
    #     away". Under RTL, `cleanup()` unmounts the focused trigger, so from
    #     the SECOND popup test in a file onwards the trigger opens on
    #     pointerdown and is closed again by the spurious window blur that the
    #     same click's `focus()` fires. Symptom: `findByRole("listbox")` /
    #     `findByRole("menuitem")` time out (Dependabot PR #440, CI run
    #     35487650398).
    #   * This is NOT what a browser does. Control run in Chromium: focus A,
    #     remove A, focus B — Chromium fires a blur targeted at the REMOVED
    #     ELEMENT and no window-targeted blur at all, so Radix's window
    #     listener never fires. jsdom 30.1.0 is the outlier.
    #   * Upstream: jsdom/jsdom#4347 (open, cites this exact Radix Select
    #     symptom); fix PRs jsdom/jsdom#4346 / #4348 / #4351 are in flight and
    #     30.1.0 is still `latest`.
    #
    # The hold is narrow on purpose. Only the minor line is ignored, so 30.0.x
    # patches still arrive (as would a SECURITY update, which an `update-types`
    # ignore never suppresses, while the repository setting is on — see the
    # header), and a future jsdom major still opens a PR for normal review.
    # REVISIT when jsdom/jsdom#4347 ships fixed: drop this entry, bump jsdom,
    # and confirm tests/component/locale-switcher.test.tsx and
    # administrator-top-header.test.tsx stay green (they are the regression
    # detector — CI, not this entry, is what actually stops a bad jsdom).
    ignore:
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
      - dependency-name: jsdom
        update-types: ["version-update:semver-minor"]

  # The deploy CLI (`vercel-cli/`) is its own pnpm package with its own lockfile,
  # and Dependabot's VERSION updates are per-directory. Without this entry the
  # `/` block above never looked at it, so nothing ever proposed an upgrade there
  # — while security ALERTS, which scan every manifest regardless of this file,
  # quietly accumulated to 37 (one critical, seventeen high) before anyone looked.
  # That gap is the reason this entry exists; do not remove it. (Since F-28,
  # dependency-audit.yml also audits this lockfile on every PR and reads the
  # alerts weekly, so a new advisory here turns a check red rather than waiting
  # for somebody to open the Security tab.)
  #
  # Almost everything in that tree is transitive under `vercel`, which is already
  # on its latest version, so most fixes there are override floors rather than
  # upgrades (documented in vercel-cli/README.md). Expect this directory to open
  # few PRs — its value is that a fixable upgrade can no longer go unnoticed.
  - package-ecosystem: npm
    directory: /vercel-cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
    groups:
      vercel-cli-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    commit-message:
      prefix: deps(vercel-cli)
