# Dependabot keeps our pinned dependencies current (review finding F4).
#
# Why this exists: the GitHub Actions in .github/workflows/* are pinned to
# immutable commit SHAs (a compromised or force-moved tag therefore can't
# inject code). A SHA pin is only safe if something proposes the upgrades —
# that is Dependabot's job here. It opens one PR per update with the new SHA
# and a refreshed `# vX.Y.Z` comment, so every bump (including major jumps such
# as actions/checkout v4 -> v7) is reviewed and CI-gated individually instead
# of silently floating on a mutable tag.
#
# The npm updates burn down the dependency backlog so we can eventually lower
# the audit gate (dependency-audit.yml) from `high` to `moderate` (see F4 /
# package.json auditConfig).
#
# The `docker` ecosystem tracks the digest-pinned `node:24-bookworm-slim` base
# image in the Dockerfile (both stages share one digest), so base-image CVE
# fixes arrive as reviewable PRs instead of accumulating until the weekly Trivy
# scan (docker-scan.yml, a required check) goes red.
#
# NOT covered here: the gitleaks and lychee container images are pinned by
# digest inside `docker run` steps (not `uses:`), which no Dependabot ecosystem
# tracks — bump those manually using the `# vX.Y.Z` comment next to each digest.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
    # Node MAJOR jumps (22 -> 26, PR #388) are a deliberate runtime upgrade
    # (.nvmrc, CI setup-node, engines, the dependency-governance invariant all
    # pin 22) — never an unattended bump. Digest and minor/patch bumps still
    # arrive; hand-closing a major PR would only make Dependabot re-propose it.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Supply-chain cooldown (review #226): never propose a version that has
    # been on the registry for less than a day — long enough for a hijacked
    # publish to be pulled. Security advisories are exempt (Dependabot always
    # opens those immediately), so this delays convenience bumps only. It also
    # keeps Dependabot in step with `.npmrc`'s `minimum-release-age=1440`,
    # which would otherwise refuse to RE-RESOLVE a bump proposed inside the
    # cooldown window (e.g. when a maintainer regenerates the lockfile).
    cooldown:
      default-days: 1
    # Group routine minor/patch bumps to keep PR volume sane; major updates and
    # security advisories still open as individual PRs for closer review.
    groups:
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    # Declined majors (each is a real port, tracked separately — see the
    # 2026-09-04 review): @tanstack/react-table v9 (187 type errors across 19
    # files: useTable + tableFeatures registry, TFeatures generics, prototype
    # methods; PR #378). Minor/patch bumps still arrive.
    #
    # jsdom is HELD at 30.0.1 on a MINOR hold (not a decline) because 30.1.0
    # regressed focus emulation in a way that silently breaks every Radix popup
    # test. Evidence, so the next person does not re-derive it:
    #
    #   * jsdom 30.1.0 added a focus-fixup rule to Node-impl.js `_removingSteps`:
    #     removing the focused element now sets `_lastFocusedElement` to the
    #     DOCUMENT (30.0.1 set it to `null`). The next `element.focus()` then
    #     treats that Document as the previously-focused thing, and
    #     `fireFocusEventWithTargetAdjustment` retargets a Document to its
    #     Window — so a `blur` event is dispatched AT `window`.
    #   * @radix-ui/react-select and @radix-ui/react-menu both do
    #     `window.addEventListener("blur", close)` to notice "the user switched
    #     away". Under RTL, `cleanup()` unmounts the focused trigger, so from
    #     the SECOND popup test in a file onwards the trigger opens on
    #     pointerdown and is closed again by the spurious window blur that the
    #     same click's `focus()` fires. Symptom: `findByRole("listbox")` /
    #     `findByRole("menuitem")` time out (Dependabot PR #440, CI run
    #     35487650398).
    #   * This is NOT what a browser does. Control run in Chromium: focus A,
    #     remove A, focus B — Chromium fires a blur targeted at the REMOVED
    #     ELEMENT and no window-targeted blur at all, so Radix's window
    #     listener never fires. jsdom 30.1.0 is the outlier.
    #   * Upstream: jsdom/jsdom#4347 (open, cites this exact Radix Select
    #     symptom); fix PRs jsdom/jsdom#4346 / #4348 / #4351 are in flight and
    #     30.1.0 is still `latest`.
    #
    # The hold is narrow on purpose. Only the minor line is ignored, so 30.0.x
    # patches — and any SECURITY update, which `ignore` never suppresses — still
    # arrive, and a future jsdom major still opens a PR for normal review.
    # REVISIT when jsdom/jsdom#4347 ships fixed: drop this entry, bump jsdom,
    # and confirm tests/component/locale-switcher.test.tsx and
    # administrator-top-header.test.tsx stay green (they are the regression
    # detector — CI, not this entry, is what actually stops a bad jsdom).
    ignore:
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
      - dependency-name: jsdom
        update-types: ["version-update:semver-minor"]
