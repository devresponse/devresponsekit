name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs on the same ref are wasted compute — cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, format, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Matches docker-compose.yml. The vitest suites stub the DB layer
      # and don't need it today; the service is groundwork for the
      # Playwright e2e/a11y suites (seeded DB + `next start`) so adding
      # them later is a job step, not an infrastructure change.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: devresponse
          POSTGRES_PASSWORD: devresponse
          POSTGRES_DB: devresponse_db
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U devresponse -d devresponse_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # vitest.setup.ts provides test defaults for required env vars;
      # DATABASE_URL points at the service for future DB-backed suites.
      DATABASE_URL: postgresql://devresponse:devresponse@localhost:5444/devresponse_db
      DB_SCHEMA: auth

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Build BEFORE the (~100s) test run so config / Next build errors —
      # e.g. an invalid vitest.config option that only `next build`
      # type-checks — fail this fast job in ~1-2 min instead of slipping to
      # the slow Playwright job or to Vercel. `next build` sets
      # NEXT_PHASE=phase-production-build, so env.ts uses placeholders and
      # no secrets are needed here.
      - name: Build
        run: pnpm build

      - name: Tests with coverage gate
        run: pnpm test:coverage

      # F1: the postgres service declared above (added as groundwork) is finally
      # exercised here — apply the app migrations, then run the live-DB scoping
      # suites that verify SQL / tenant-isolation correctness, not just mocks.
      - name: DB-backed integration tests
        run: |
          pnpm db:app:migrate
          pnpm test:db

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  browser:
    name: E2E + accessibility (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: devresponse
          POSTGRES_PASSWORD: devresponse
          POSTGRES_DB: devresponse_db
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U devresponse -d devresponse_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only values; the suites sign in with the seeded admin and
      # exercise the real Better Auth + admin APIs against the service DB.
      DATABASE_URL: postgresql://devresponse:devresponse@localhost:5444/devresponse_db
      DB_SCHEMA: auth
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SSO_HANDOFF_ISSUER: http://localhost:3000
      SSO_HANDOFF_AUDIENCE_PREFIX: devresponse-app
      SSO_HANDOFF_APPLICATION_ID: portal
      SSO_HANDOFF_JWT_SECRET: ci-only-sso-handoff-secret-not-for-production
      SEED_ADMIN_EMAIL: admin@devresponse.local
      SEED_ADMIN_PASSWORD: ChangeMe-LocalOnly-123!
      SEED_DEFAULT_ORGANIZATION_SLUG: default
      # The suites sign in far faster than the production limiter's
      # 3 req / 10 s budget for /sign-in/email — test-only escape hatch.
      AUTH_RATE_LIMIT_DISABLED: "1"
      # F2: enable the machine API (client-credentials e2e) and allow the SSO
      # e2e to register a destination app under devresponse.com. The signing
      # key is generated per run in the step below (never committed).
      API_JWT_ENABLED: "1"
      SSO_ALLOWED_ORIGIN_SUFFIXES: devresponse.com

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # F2: the machine-API e2e needs a JWT signing key. Mint an ephemeral
      # CI-only Ed25519 key at runtime and export it for the server boot — a
      # private key must never be committed (gitleaks would flag it).
      - name: Generate an ephemeral API JWT signing key (CI only)
        run: |
          KEY=$(node -e "import('jose').then(async (j) => { const { privateKey } = await j.generateKeyPair('EdDSA', { extractable: true }); process.stdout.write(JSON.stringify(await j.exportJWK(privateKey))) })")
          echo "API_JWT_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Migrate and seed
        run: |
          pnpm db:auth:migrate
          pnpm db:app:migrate
          pnpm db:seed

      - name: Start server
        run: |
          pnpm start &
          timeout 60 bash -c 'until curl -fsS http://localhost:3000/en/sign-in > /dev/null; do sleep 1; done'

      - name: E2E suite
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_NO_SERVER: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Accessibility suite
        run: pnpm test:a11y
        env:
          PLAYWRIGHT_NO_SERVER: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # HARD GATE (BUILD-1). A high or critical advisory fails this job and
    # blocks the merge. The known dev/build-only advisories are pinned in an
    # explicit allowlist (package.json -> pnpm.auditConfig.ignoreGhsas), so a
    # NEW high+ that nobody has reviewed is what trips the gate — not the
    # existing, triaged backlog. Prune the allowlist as upstream fixes land.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the job on any high or critical advisory not in the
      # pnpm.auditConfig.ignoreGhsas allowlist. Lower the threshold to
      # `moderate` once the moderate backlog is clear.
      - name: Audit dependencies (high and above)
        run: pnpm audit --audit-level high

  sdk-drift:
    name: OpenAPI + admin SDK drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # BUILD-2: the OpenAPI spec (docs/openapi*.json) and the admin SDK
    # (sdk/admin) are GENERATED artifacts. Regenerate them from source and fail
    # if anything changed — so a new or edited admin route can never ship with
    # a stale spec or SDK. Deterministic: the generator version is pinned in
    # openapitools.json (7.12.0) and .gitattributes normalizes output to LF.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # openapi-generator-cli runs on the JVM.
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate the OpenAPI spec + admin SDK
        run: pnpm sdk:admin:generate

      - name: Fail on spec / SDK drift
        run: |
          if ! git diff --quiet; then
            echo "::error::OpenAPI spec or admin SDK is out of date — run 'pnpm sdk:admin:generate' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Typecheck the generated SDK
        run: pnpm sdk:admin:typecheck

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # F6: catch documentation link rot — a moved/renamed doc or a stale
    # #heading anchor — before it ships. The G1 README rot regressed precisely
    # because nothing checked. lychee runs in --offline mode: it verifies that
    # every relative file link and #fragment in the PUBLISHED docs resolves to
    # a real target, with zero network calls. External URL liveness is
    # deliberately OUT of scope here — it flakes in a hard gate (a slow/blocked
    # third-party site would randomly block merges); a scheduled non-blocking
    # job is the right home for that if we want it later. lychee runs from its
    # official MIT-licensed container image, matching the gitleaks pattern in
    # secret-scan.yml. docs-backup/, generated SDK docs, and internal planning
    # files (specs.md, PRODUCTION-READINESS-*) are intentionally not checked.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check documentation links (offline, with fragments)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --offline --include-fragments --no-progress \
            README.md SECURITY.md CONTRIBUTING.md CHANGELOG.md docs

  auth-schema-drift:
    name: Better Auth schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # B4: src/db/migrations/better-auth-schema.sql is a GENERATED snapshot of
    # the Better Auth identity DDL that `pnpm db:auth:migrate` applies at deploy.
    # Regenerate it and fail if it differs from the committed file — so a
    # better-auth upgrade that silently changes the vendor schema is caught here
    # (and is the cue to re-check the hand-typed Kysely mirrors in app-schema.ts).
    # The generator compiles against a throwaway, freshly-empty schema, so its
    # output is deterministic regardless of the service DB's state.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: devresponse
          POSTGRES_PASSWORD: devresponse
          POSTGRES_DB: devresponse_db
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U devresponse -d devresponse_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://devresponse:devresponse@localhost:5444/devresponse_db
      DB_SCHEMA: auth
      # Importing @/lib/auth validates the env at load; CI-only placeholders.
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SSO_HANDOFF_ISSUER: http://localhost:3000
      SSO_HANDOFF_AUDIENCE_PREFIX: devresponse-app
      SSO_HANDOFF_APPLICATION_ID: portal
      SSO_HANDOFF_JWT_SECRET: ci-only-sso-handoff-secret-not-for-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate the Better Auth schema snapshot
        run: pnpm db:auth:generate

      - name: Fail on schema drift
        run: |
          if ! git diff --quiet -- src/db/migrations/better-auth-schema.sql; then
            echo "::error::Better Auth schema snapshot is stale — run 'pnpm db:auth:generate' and commit src/db/migrations/better-auth-schema.sql."
            git --no-pager diff -- src/db/migrations/better-auth-schema.sql
            exit 1
          fi
