name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs on the same ref are wasted compute — cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, format, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Matches docker-compose.yml. The vitest suites stub the DB layer
      # and don't need it today; the service is groundwork for the
      # Playwright e2e/a11y suites (seeded DB + `next start`) so adding
      # them later is a job step, not an infrastructure change.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: devresponse
          POSTGRES_PASSWORD: devresponse
          POSTGRES_DB: devresponse_db
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U devresponse -d devresponse_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # vitest.setup.ts provides test defaults for required env vars;
      # DATABASE_URL points at the service for future DB-backed suites.
      DATABASE_URL: postgresql://devresponse:devresponse@localhost:5444/devresponse_db
      DB_SCHEMA: auth

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Build BEFORE the (~100s) test run so config / Next build errors —
      # e.g. an invalid vitest.config option that only `next build`
      # type-checks — fail this fast job in ~1-2 min instead of slipping to
      # the slow Playwright job or to Vercel. `next build` sets
      # NEXT_PHASE=phase-production-build, so env.ts uses placeholders and
      # no secrets are needed here.
      - name: Build
        run: pnpm build

      - name: Tests with coverage gate
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  browser:
    name: E2E + accessibility (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: devresponse
          POSTGRES_PASSWORD: devresponse
          POSTGRES_DB: devresponse_db
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U devresponse -d devresponse_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only values; the suites sign in with the seeded admin and
      # exercise the real Better Auth + admin APIs against the service DB.
      DATABASE_URL: postgresql://devresponse:devresponse@localhost:5444/devresponse_db
      DB_SCHEMA: auth
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SSO_HANDOFF_ISSUER: http://localhost:3000
      SSO_HANDOFF_AUDIENCE_PREFIX: devresponse-app
      SSO_HANDOFF_APPLICATION_ID: portal
      SSO_HANDOFF_JWT_SECRET: ci-only-sso-handoff-secret-not-for-production
      SEED_ADMIN_EMAIL: admin@devresponse.local
      SEED_ADMIN_PASSWORD: ChangeMe-LocalOnly-123!
      SEED_DEFAULT_ORGANIZATION_SLUG: default
      # The suites sign in far faster than the production limiter's
      # 3 req / 10 s budget for /sign-in/email — test-only escape hatch.
      AUTH_RATE_LIMIT_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Migrate and seed
        run: |
          pnpm db:auth:migrate
          pnpm db:app:migrate
          pnpm db:seed

      - name: Start server
        run: |
          pnpm start &
          timeout 60 bash -c 'until curl -fsS http://localhost:3000/en/sign-in > /dev/null; do sleep 1; done'

      - name: E2E suite
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_NO_SERVER: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Accessibility suite
        run: pnpm test:a11y
        env:
          PLAYWRIGHT_NO_SERVER: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NON-BLOCKING for now (dep-2). A backlog of known advisories exists and
    # is being worked down, so a hard failure would red-wall every merge
    # under the auto-merge-on-green policy.
    #
    # The NON-BLOCKING behaviour lives on the audit STEP (`continue-on-error`
    # below), NOT on this job. That distinction matters: a step-level
    # `continue-on-error` lets the step be marked "failed but allowed" while
    # the JOB still concludes green, so this check passes and never stalls
    # auto-merge. Job-level `continue-on-error` would instead keep the
    # workflow green but report THIS job's check as FAILED — a red ❌ that
    # red-walls the PR and blocks auto-merge-on-green. (That was the original
    # bug.)
    #
    # Tighten to a hard gate later — drop the step's `continue-on-error`
    # (and ideally add this to required checks + pin a reviewed allowlist) —
    # once the high+ backlog is cleared.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exits non-zero when a high or critical advisory is present. The
      # `continue-on-error` keeps that finding VISIBLE (the step renders as
      # failed-but-allowed in the run) without failing the job's check, so a
      # high+ advisory surfaces but does not gate merges. Lower the threshold
      # to `moderate` once the high+ backlog is clear.
      - name: Audit dependencies (high and above)
        continue-on-error: true
        run: pnpm audit --audit-level high
