name: CodeQL

# Static application security testing (BUILD-1). Runs CodeQL's
# security-extended query suite over the TypeScript/JavaScript source and
# publishes findings to the repo's Security tab (code scanning). JS/TS needs no
# build step — CodeQL extracts directly from source.
#
# What blocks a merge (F-112): the `Analyze (javascript-typescript)` job below is
# a REQUIRED status check on `main`, but it only runs the analysis and uploads
# the results — it passes whatever it finds. The check that FAILS on a new alert
# is `CodeQL`, which GitHub posts once it has processed the upload, and it is not
# in the required set: until an operator adds it (as `gitleaks` already is) or a
# code-scanning ruleset rule, a new finding shows on the PR without blocking it.
# See docs/testing.md §9. Keep the job name stable either way.
#
# Note: code scanning (SARIF) requires GitHub Advanced Security on private
# repos; it is free for public repos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly catch-all so advisories that land between commits still surface.
    - cron: "27 4 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"
