name: CodeQL

# Static application security testing (BUILD-1). Runs CodeQL's
# security-extended query suite over the TypeScript/JavaScript source and
# publishes findings to the repo's Security tab (code scanning). JS/TS needs no
# build step — CodeQL extracts directly from source. The `Analyze
# (javascript-typescript)` job is a REQUIRED status check on `main` (branch
# protection), so a security-extended finding blocks the merge — keep it in the
# required set.
#
# Note: code scanning (SARIF) requires GitHub Advanced Security on private
# repos; it is free for public repos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly catch-all so advisories that land between commits still surface.
    - cron: "27 4 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:javascript-typescript"
