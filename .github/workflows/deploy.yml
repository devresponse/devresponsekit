name: Deploy (production)

# Promotes `main` to Vercel production, running the database migrations FIRST.
#
# Ordering contract: migrations are applied to the production database BEFORE
# the new build is promoted to the production alias, so the currently-live
# build keeps working against a schema it understands. This relies on
# migrations being additive / backward-compatible (expand-then-contract) and
# idempotent — they are ledgered in `app_schema_migrations`, so a re-run is a
# no-op (see docs/deployment.md).
#
# Requires Vercel's automatic Git production deploys to be DISABLED so THIS
# workflow is the only path to production (Vercel → Project → Settings → Git:
# turn off production-branch auto-deploy, or set an "Ignored Build Step").
#
# Repository secrets required (Settings → Secrets → Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   PRODUCTION_DIRECT_DATABASE_URL  — the DIRECT (non-pooled) connection string;
#       DDL + advisory locks must not go through a transaction pooler.
# Optional repository variable: DB_SCHEMA (defaults to `auth`).

# Gated on CI (audit #19): promote ONLY a commit that passed the full CI run,
# instead of firing on every push to main before tests finish (a red PR could
# otherwise migrate prod + ship). `workflow_dispatch` stays for manual /
# rollback deploys.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never interrupt a migrate+deploy mid-flight; queue instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate prod DB, then promote to Vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A workflow_run fires on CI failure too, so only proceed when the
    # triggering CI run SUCCEEDED. A manual dispatch always proceeds.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # Gate behind a GitHub Environment for required reviewers + scoped secrets
    # (docs/deployment.md §6). Remove `environment:` for unattended deploys.
    environment: production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy the EXACT commit CI validated. A `workflow_run` event
          # otherwise checks out the default branch's HEAD, which may have moved
          # past the commit that passed CI; a manual dispatch uses its own ref.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1) Migrations FIRST, against the DIRECT (non-pooled) production endpoint.
      #    Idempotent + ledgered, so re-running a no-op deploy is safe.
      - name: Apply database migrations (production)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_DATABASE_URL }}
          DB_SCHEMA: ${{ vars.DB_SCHEMA || 'auth' }}
        run: pnpm db:app:migrate

      # 2) Only after migrations succeed: build with the production env pulled
      #    from Vercel (so NEXT_PUBLIC_* inline correctly) and promote.
      - name: Install Vercel CLI
        run: pnpm add -g vercel@54.14.5 # pin for reproducibility; bump deliberately

      - name: Pull Vercel production environment + project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for production
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy the prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
