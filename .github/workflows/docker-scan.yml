name: Docker image scan

# Builds the production image from the (digest-pinned) Dockerfile and scans it
# with Trivy, failing on FIXABLE high/critical vulnerabilities. The `trivy` job
# is a REQUIRED status check on `main` (branch protection), so a fixable
# high/critical blocks the merge — keep it in the required set. This complements
# `pnpm audit` (which gates the JS dependency tree): the image scan covers the
# base OS layer and anything baked into the runtime image. Unfixable base-OS
# CVEs are excluded (`--ignore-unfixed`); accepted, non-runtime-reachable
# findings are documented in `.trivyignore`. A weekly run catches newly
# disclosed CVEs in an otherwise-unchanged image.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: docker-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build production image
        run: docker build -t devresponsekit:scan .

      # Publish findings to the Security tab (best-effort; the hard gate is the
      # next step). Mirrors the gitleaks job's SARIF flow.
      - name: Trivy scan → SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: devresponsekit:scan
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          format: sarif
          output: trivy.sarif

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: trivy.sarif
          category: trivy

      # The hard gate: fail on any FIXABLE high/critical not in `.trivyignore`.
      - name: Trivy scan → gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devresponsekit:scan
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: "1"
          format: table
