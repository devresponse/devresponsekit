name: Mutation testing

# Proves the SECURITY CORE's tests actually ASSERT, not just execute (Stryker):
# a surviving mutant is a production-code change no test caught. ADVISORY (not a
# required status check) and PATH-FILTERED to the mutated modules + tests, so it
# only runs when it can change. A score below the `break` threshold in
# stryker.config.mjs fails THIS job (visible in the PR) without blocking merges
# on occasional mutation-run flakiness. Promote to a required check once stable.
on:
  pull_request:
    branches: [main]
    # Keep in step with `mutate` in stryker.config.mjs (review #229).
    paths:
      - "src/lib/api-auth/scopes.ts"
      - "src/lib/safe-return-to.ts"
      - "src/lib/admin/list-query.server.ts"
      - "src/lib/api-auth/api-key.ts"
      - "src/lib/trusted-origins.ts"
      - "src/lib/admin/origin-guard.server.ts"
      - "tests/**"
      - "stryker.config.mjs"
      - "scripts/check-mutation-floors.mjs"
      - "vitest.config.ts"
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker (security core)
    runs-on: ubuntu-latest
    # 441 mutants at concurrency 1 (review #229 widened the scope from 325).
    # Measured end-to-end at 44 minutes locally, so the previous 20 was already
    # short of the OLD scope (~30 min at the same rate) — this is the first
    # honest value, not extra room. The margin is for a slower runner, not for
    # further growth: a module that pushes past this is a signal to re-scope
    # (or to parallelise) rather than to raise the number again.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No Postgres service needed: the mutated modules are pure, and Stryker's
      # dry run uses the default vitest config, which excludes tests/db.
      # `pnpm test:mutation` runs Stryker and then the PER-FILE floor check
      # (scripts/check-mutation-floors.mjs, review #229) — the aggregate
      # `break` threshold alone would let one module's score rot behind
      # another's.
      - name: Run mutation testing (security core)
        run: pnpm test:mutation
