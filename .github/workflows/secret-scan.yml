name: Secret scan

# Secret scanning (BUILD-1). Runs gitleaks over the checkout and publishes
# findings to the repo's Security tab (code scanning), then fails the job if
# anything turns up. The `gitleaks` job is a REQUIRED status check on `main`
# (branch protection), so a hit blocks the merge — keep it in the required set.
# The allowlist of intentional dummy/example values lives in .gitleaks.toml so
# this gate stays honest.
#
# We invoke gitleaks via its official container image rather than the
# gitleaks-action: the action requires a paid GITLEAKS_LICENSE for org-owned
# repos, while the binary is MIT-licensed and unrestricted.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Scan the working tree (fresh checkout = committed source only; no build
      # output or node_modules present). Don't fail the step here — we want the
      # SARIF uploaded first, then gate explicitly below.
      - name: Run gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect \
            --source=/repo \
            --no-git \
            --config=/repo/.gitleaks.toml \
            --redact \
            --report-format=sarif \
            --report-path=/repo/gitleaks.sarif

      # Publish to code scanning. continue-on-error so a repo without GitHub
      # Advanced Security (which gates SARIF upload on private repos) still gets
      # the hard gate below — the upload is a bonus, not the gate.
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Fail if secrets were found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::gitleaks detected potential secrets. Review the step log above (or the Security tab, category: gitleaks). If it's a false positive, add an entry to .gitleaks.toml."
          exit 1
